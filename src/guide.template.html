<!doctype html>
<html lang="en">
<head>
    <!-- @head -->
    <title>{{PAGE_TITLE}} · Vellum Shell guide</title>
    <meta name="description" content="{{PAGE_DESCRIPTION}}">
    <link rel="canonical" href="https://{{DOMAIN}}{{PAGE_URL}}">
    <meta property="og:title" content="{{PAGE_TITLE}} · Vellum Shell">
    <meta property="og:description" content="{{PAGE_DESCRIPTION}}">
    <meta property="og:url" content="https://{{DOMAIN}}{{PAGE_URL}}">
</head>
<body class="page-guide">
    <!-- @splash -->
    <!-- @header -->

    <div class="guide-layout">
        <aside class="guide-nav" aria-label="Guide">
            <button class="guide-nav-toggle" type="button" aria-expanded="false" aria-controls="guide-contents">
                <span><span class="guide-nav-toggle-num">{{PAGE_NUMBER}}</span>{{PAGE_TITLE}}</span>
                <span class="guide-nav-toggle-hint">Contents</span>
            </button>
            <nav class="guide-nav-body" id="guide-contents">
                <p class="guide-nav-title"><a href="/guide/">The Vellum guide</a></p>
                <!-- @nav -->
            </nav>
        </aside>

        <main id="main" class="guide-main">
            <header class="guide-head">
                <p class="guide-chapter" aria-label="Chapter {{PAGE_NUMBER}} of {{PAGE_COUNT}}">{{PAGE_NUMBER}}</p>
                <h1>{{PAGE_TITLE}}</h1>
                <p class="guide-description">{{PAGE_DESCRIPTION}}</p>
            </header>
            <article class="prose">
                <!-- @content -->
            </article>
            <nav class="pager" aria-label="Previous and next chapter">
                <!-- @pager -->
            </nav>
            <p class="guide-edit">Something wrong or missing? <a href="{{PAGE_SOURCE}}">Edit this page on GitHub</a>.</p>
        </main>
    </div>

    <!-- @footer -->
</body>
</html>
