name: checks

# Ugyanaz a `scripts/check`, ami helyben fut, csak csoportonkent kulon jobban,
# hogy a hibas resz egy pillantasra latszodjon. A szigoru mod miatt egy
# hianyzo eszkoz itt bukas, nem csendes kihagyas.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-

      # A generatorok a HOME ala irnanak; a tesztek sajat homokozot allitanak,
      # a mellekhatasokat (gsettings, systemctl, magick) pedig kikapcsoljuk.
      - name: Rust kapuk
        env:
          VELLUM_NO_SIDE_EFFECTS: "1"
          VELLUM_CHECK_STRICT: "1"
        run: ./scripts/check rust

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Qt eszkozok
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest \
            qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript

      # Ugyanaz a qmllint-hivas, keret es kategoria-ellenorzes, mint helyben.
      - name: QML kapuk
        env:
          VELLUM_CHECK_STRICT: "1"
        run: ./scripts/check qml

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ShellCheck telepitese
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell es generator kapuk
        env:
          VELLUM_CHECK_STRICT: "1"
        run: ./scripts/check shell
