name: checks

# Ugyanaz a `scripts/check`, ami helyben fut, csak csoportonkent kulon jobban,
# hogy a hibas resz egy pillantasra latszodjon. A szigoru mod miatt egy
# hianyzo eszkoz itt bukas, nem csendes kihagyas.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-

      # A generatorok a HOME ala irnanak; a tesztek sajat homokozot allitanak,
      # a mellekhatasokat (gsettings, systemctl, magick) pedig kikapcsoljuk.
      - name: Rust kapuk
        env:
          VELLUM_NO_SIDE_EFFECTS: "1"
          VELLUM_CHECK_STRICT: "1"
        run: ./scripts/check rust

  # A qmllint a Quickshell moduljainak tipusleirasabol dolgozik (qmldir,
  # *.qmltypes). Ha a Quickshell hianyzik, a tipusok feloldatlanok, es a keret meg
  # a kategoria-ellenorzes [import] es [required] zajon bukik el. Ubuntura nincs
  # csomagja, ezert Fedoran fut, ugyanabbol a COPR-bol, amit az install.sh is
  # hasznal: igy a CI ugyanazt az eredmenyt adja, mint a fejlesztoi gep.
  qml:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Qt eszkozok es Quickshell
        run: |
          dnf install -y --setopt=install_weak_deps=False dnf5-plugins
          dnf -y copr enable lionheartp/Hyprland
          dnf install -y --setopt=install_weak_deps=False \
            qt6-qtdeclarative-devel qt6-qtbase-gui quickshell

      # Ugyanaz a qmllint-hivas, keret es kategoria-ellenorzes, mint helyben.
      - name: QML kapuk
        env:
          VELLUM_CHECK_STRICT: "1"
        run: ./scripts/check qml

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ShellCheck telepitese
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shell es generator kapuk
        env:
          VELLUM_CHECK_STRICT: "1"
        run: ./scripts/check shell
