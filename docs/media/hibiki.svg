  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(2 0)">
    <ellipse cx="21" cy="44" rx="7.5" ry="5.8" transform="rotate(-20 21 44)" fill="#e7dfcd"/>
    <path d="M 27.5 42 V 14 L 36 18.5" fill="none" stroke="#e7dfcd" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="none" stroke-linecap="round" stroke-width="3.6">
